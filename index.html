<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ABC Saathi</title>
    <script>
        const androidUrl = "https://play.google.com/store/apps/details?id=com.tfl.redconnect&hl=en_IN";
        const iosUrl = "https://apps.apple.com/us/app/abc-saathi/id6760895787";

        const ua = navigator.userAgent;

        if (/Android/i.test(ua)) {
            window.location.replace(androidUrl);
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
            window.location.replace(iosUrl);
        } else {
            window.location.replace(androidUrl);
        }
    </script>
</head>
<body>
    Redirecting to ABC Saathi...
</body>
</html>
